<svg width="800" height="1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#000000;stop-opacity:1" />
    </linearGradient>
    <pattern id="rebar" width="40" height="40" patternUnits="userSpaceOnUse">
       <line x1="0" y1="0" x2="40" y2="40" stroke="#333" stroke-width="2"/>
       <line x1="40" y1="0" x2="0" y2="40" stroke="#333" stroke-width="2"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grad1)" />
  <rect width="100%" height="100%" fill="url(#rebar)" opacity="0.3"/>
  <rect x="100" y="600" width="600" height="100" fill="#222" stroke="#FF5E00" stroke-width="2"/>
  <rect x="150" y="550" width="20" height="200" fill="#555"/>
  <rect x="630" y="550" width="20" height="200" fill="#555"/>
  <text x="50%" y="50%" font-family="sans-serif" font-size="24" fill="#FF5E00" text-anchor="middle">FUNDAMENTY</text>
</svg>